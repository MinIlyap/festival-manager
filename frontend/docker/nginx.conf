server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/auth        { set $upstream authservice:8082;         include /etc/nginx/api-proxy.conf; }
    location /api/oauth2      { set $upstream authservice:8082;         include /etc/nginx/api-proxy.conf; }
    location /api/application { set $upstream applicationservice:8081;  include /etc/nginx/api-proxy.conf; }
    location /api/company     { set $upstream companyservice:8083;      include /etc/nginx/api-proxy.conf; }
    location /api/qr/events   { set $upstream eventservice:8084;        include /etc/nginx/api-proxy.conf; }
    location /api/events      { set $upstream eventservice:8084;        include /etc/nginx/api-proxy.conf; }
    location /api/qr/festivals { set $upstream festivalservice:8085;    include /etc/nginx/api-proxy.conf; }
    location /api/ticket      { set $upstream festivalservice:8085;     include /etc/nginx/api-proxy.conf; }
    location /api/festival    { set $upstream festivalservice:8085;     include /etc/nginx/api-proxy.conf; }
    location /api/file        { set $upstream fileservice:8086;         include /etc/nginx/api-proxy.conf; }
    location /api/location    { set $upstream locationservice:8087;     include /etc/nginx/api-proxy.conf; }
    location /api/notification { set $upstream notificationservice:8088; include /etc/nginx/api-proxy.conf; }
    location /api/user        { set $upstream userservice:8089;         include /etc/nginx/api-proxy.conf; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
