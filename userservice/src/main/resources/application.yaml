spring:
  application:
    name: userservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: user_db
    username: user_service_user
    password: user_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/user_db
  jpa:
    hibernate:
      ddl-auto: validate
jwt:
  secret:
    access: "my_super_secret_access_key_that_must_be_long_enough_for_hs256"

internal:
  system-token: "my_super_secret_system_token_123"
crypto:
  secret-key: "MySuperSecretKey1234567890123456"
server:
  port: 8089
services:
  festival:
    url: http://localhost:8085
  location:
    url: http://localhost:8087/location
