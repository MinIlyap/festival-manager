databaseChangeLog:
  - changeSet: 
      id: 002-add-tickets
      author: ilyap
      changes:
        - createTable:
            tableName: ticket_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(5,2)
              - column:
                  name: festival_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_ticket_types_festival
            baseTableName: ticket_types
            baseColumnNames: festival_id
            referencedTableName: festivals
            referencedColumnNames: id

        - createIndex:
            indexName: idx_ticket_types_festival
            tableName: ticket_types
            columns:
              - column:
                  name: festival_id

        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ticket_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: final_price
                  type: DECIMAL(6,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_tickets_type
            baseTableName: tickets
            baseColumnNames: ticket_type_id
            referencedTableName: ticket_types
            referencedColumnNames: id

        - createIndex:
            indexName: idx_tickets_expiry
            tableName: tickets
            columns:
              - column:
                  name: expiry_date
        - createIndex:
            indexName: idx_tickets_user_ticket_type
            tableName: tickets
            columns:
              - column:
                  name: user_id
              - column:
                  name: ticket_type_id