databaseChangeLog:
  - changeSet: 
      id: 002-add-tickets
      author: ilyap
      changes:
        - createTable:
            tableName: ticket_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    unique: true
                    nullable: false

        - createTable:
            tableName: ticket_type_instances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(7,2)
                  constraints:
                    nullable: false
              - column:
                  name: festival_location_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ticket_type_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - sql:
            sql: |
              ALTER TABLE ticket_type_instances ADD CONSTRAINT chk_ticket_type_instances_price_positive CHECK (price >= 0);

        - addForeignKeyConstraint:
            constraintName: fk_ticket_type_instances_festival_location
            baseTableName: ticket_type_instances
            baseColumnNames: festival_location_id
            referencedTableName: festival_locations
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_ticket_type_instances_ticket_type
            baseTableName: ticket_type_instances
            baseColumnNames: ticket_type_id
            referencedTableName: ticket_types
            referencedColumnNames: id

        - createIndex:
            indexName: idx_ticket_type_instances_festival_location
            tableName: ticket_type_instances
            columns:
              - column:
                  name: festival_location_id
        - createIndex:
            indexName: idx_ticket_type_instances_ticket_type
            tableName: ticket_type_instances
            columns:
              - column:
                  name: ticket_type_id

        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ticket_type_instance_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: final_price
                  type: DECIMAL(8,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: |
              ALTER TABLE tickets ADD CONSTRAINT chk_tickets_quantity_positive CHECK (quantity > 0);
              ALTER TABLE tickets ADD CONSTRAINT chk_tickets_final_price_positive CHECK (final_price >= 0);

        - addForeignKeyConstraint:
            constraintName: fk_tickets_type_instance
            baseTableName: tickets
            baseColumnNames: ticket_type_instance_id
            referencedTableName: ticket_type_instances
            referencedColumnNames: id

        - createIndex:
            indexName: idx_tickets_expiry
            tableName: tickets
            columns:
              - column:
                  name: expiry_date
        - createIndex:
            indexName: idx_tickets_user
            tableName: tickets
            columns:
              - column:
                  name: user_id