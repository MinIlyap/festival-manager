spring:
  application:
    name: festivalservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: festival_db
    username: festival_service_user
    password: festival_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5436/festival_db
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: festival-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

jwt:
  secret:
    access: "my_super_secret_access_key_that_must_be_long_enough_for_hs256"

internal:
  system-token: "my_super_secret_system_token_123"
crypto:
  secret-key: "MySuperSecretKey1234567890123456"
server:
  port: 8085
services:
  auth:
    url: http://localhost:8082/auth
  company:
    url: http://localhost:8083/company
  location:
    url: http://localhost:8087/location
  user:
    url: http://localhost:8089/user
kafka:
  topics:
    festival-application-request: FESTIVAL_APPLICATION_REQUEST_TOPIC
    festival-application-response: FESTIVAL_APPLICATION_RESPONSE_TOPIC
  groups:
    festival: festival-service-group
