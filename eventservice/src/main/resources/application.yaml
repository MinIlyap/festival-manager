spring:
  application:
    name: eventservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: event_db
    username: event_service_user
    password: event_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5437/event_db
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
jwt:
  secret:
    access: "my_super_secret_access_key_that_must_be_long_enough_for_hs256"
internal:
  system-token: "my_super_secret_system_token_123"
crypto:
  secret-key: "MySuperSecretKey1234567890123456"
server:
  port: 8084
