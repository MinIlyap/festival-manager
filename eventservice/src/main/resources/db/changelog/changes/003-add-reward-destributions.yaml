databaseChangeLog:
  - changeSet:
      id: 003-add-reward-destributions
      author: ilyap
      changes:
        - createTable:
            tableName: rewards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false

        - createTable:
            tableName: reward_instances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: place
                  type: INTEGER
                  constraints:
                    nullable: true
              - column:
                  name: point_number
                  type: INTEGER
                  constraints:
                    nullable: true
              - column:
                  name: reward_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_reward_instances_reward
            baseTableName: reward_instances
            baseColumnNames: reward_id
            referencedTableName: rewards
            referencedColumnNames: id

        - createIndex:
            indexName: idx_reward_instances_reward
            tableName: reward_instances
            columns:
              - column:
                  name: reward_id

        - createTable:
            tableName: event_rewards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: festival_event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reward_instance_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            constraintName: unq_event_rewards_event_reward
            tableName: event_rewards
            columnNames: festival_event_id, reward_instance_id

        - addForeignKeyConstraint:
            constraintName: fk_event_rewards_festival_event
            baseTableName: event_rewards
            baseColumnNames: festival_event_id
            referencedTableName: festival_events
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_event_rewards_reward_instance
            baseTableName: event_rewards
            baseColumnNames: reward_instance_id
            referencedTableName: reward_instances
            referencedColumnNames: id

        - createIndex:
            indexName: idx_event_rewards_event
            tableName: event_rewards
            columns:
              - column:
                  name: festival_event_id

        - createTable:
            tableName: reward_distributions
            columns:
              - column:
                  name: event_reward_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: reward_distributions
            columnNames: event_reward_id, user_id
            constraintName: pk_reward_distributions

        - addForeignKeyConstraint:
            constraintName: fk_reward_distributions_event_reward
            baseTableName: reward_distributions
            baseColumnNames: event_reward_id
            referencedTableName: event_rewards
            referencedColumnNames: id

        - createIndex:
            indexName: idx_reward_distributions_user
            tableName: reward_distributions
            columns:
              - column:
                  name: user_id
