databaseChangeLog:
  - changeSet:
      id: 002-add-user-registrations
      author: ilyap
      changes:
        - createTable:
            tableName: commands
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_organization_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_commands_event_organization
            baseTableName: commands
            baseColumnNames: event_organization_id
            referencedTableName: event_organizations
            referencedColumnNames: id

        - createIndex:
            indexName: idx_commands_name_event
            tableName: commands
            columns:
              - column:
                  name: event_organization_id
              - column:
                  name: name

        - createTable:
            tableName: user_event_registrations
            columns:
              - column:
                  name: event_organization_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: command_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addPrimaryKey:
            tableName: user_event_registrations
            columnNames: event_organization_id, user_id
            constraintName: pk_user_event_registrations

        - addForeignKeyConstraint:
            constraintName: fk_user_event_registrations_event_organization
            baseTableName: user_event_registrations
            baseColumnNames: event_organization_id
            referencedTableName: event_organizations
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_user_event_registrations_command
            baseTableName: user_event_registrations
            baseColumnNames: command_id
            referencedTableName: commands
            referencedColumnNames: id

        - createIndex:
            indexName: idx_user_event_registrations_event
            tableName: user_event_registrations
            columns:
              - column:
                  name: event_organization_id
