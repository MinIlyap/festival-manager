databaseChangeLog:
  - changeSet:
      id: 002-add-user-registrations
      author: ilyap
      changes:
        - createTable:
            tableName: commands
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: festival_event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_commands_festival_event
            baseTableName: commands
            baseColumnNames: festival_event_id
            referencedTableName: festival_events
            referencedColumnNames: id

        - createIndex:
            indexName: idx_commands_name_event
            tableName: commands
            columns:
              - column:
                  name: festival_event_id
              - column:
                  name: name

        - createTable:
            tableName: command_members
            columns:
              - column:
                  name: command_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: command_members
            columnNames: command_id, user_id
            constraintName: pk_command_members

        - createTable:
            tableName: user_event_registrations
            columns:
              - column:
                  name: festival_event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValue: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_event_registrations
            columnNames: festival_event_id, user_id
            constraintName: pk_user_event_registrations

        - addForeignKeyConstraint:
            constraintName: fk_user_event_registrations_festival_event
            baseTableName: user_event_registrations
            baseColumnNames: festival_event_id
            referencedTableName: festival_events
            referencedColumnNames: id

        - createIndex:
            indexName: idx_user_event_registrations_event
            tableName: user_event_registrations
            columns:
              - column:
                  name: festival_event_id
