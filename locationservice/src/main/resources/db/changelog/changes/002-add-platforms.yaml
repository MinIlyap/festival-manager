databaseChangeLog:
  - changeSet:
      id: 002-add-platforms
      author: ilyap
      changes:
        - createTable:
            tableName: platforms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false

        - createTable:
            tableName: platform_instances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: house
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: city_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: platform_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_platform_instances_city
            baseTableName: platform_instances
            baseColumnNames: city_id
            referencedTableName: cities
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_platform_instances_platform
            baseTableName: platform_instances
            baseColumnNames: platform_id
            referencedTableName: platforms
            referencedColumnNames: id

        - createIndex:
            indexName: idx_platform_instances_platform
            tableName: platform_instances
            columns:
              - column:
                  name: platform_id
        - createIndex:
            indexName: idx_platform_instances_city
            tableName: platform_instances
            columns:
              - column:
                  name: city_id