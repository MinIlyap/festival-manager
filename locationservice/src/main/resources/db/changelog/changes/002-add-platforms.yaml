databaseChangeLog:
  - changeSet:
      id: 002-add-platforms
      author: ilyap
      changes:
        - createTable:
            tableName: platforms
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: house
                  type: VARCHAR(7)
                  constraints:
                    nullable: false