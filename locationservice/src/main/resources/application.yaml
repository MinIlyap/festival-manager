spring:
  application:
    name: locationservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: location_db
    username: location_service_user
    password: location_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5438/location_db
  jpa:
    hibernate:
      ddl-auto: validate
app:
  security:
    public-endpoints: "/location/**"

jwt:
  secret:
    access: "${JWT_ACCESS_SECRET:my_super_secret_access_key_that_must_be_long_enough_for_hs256}"

internal:
  system-token: "${INTERNAL_SYSTEM_TOKEN:my_super_secret_system_token_123}"
crypto:
  secret-key: "${CRYPTO_SECRET_KEY:MySuperSecretKey1234567890123456}"
server:
  port: 8087
