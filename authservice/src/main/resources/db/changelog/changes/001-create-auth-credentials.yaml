databaseChangeLog:
  - changeSet: 
      id: 001-create-auth-credentials
      author: ilyap
      changes:
        - createTable:
            tableName: auth_credentials
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: access_type
                  type: VARCHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - createIndex:
            indexName: idx_auth_credentials_user_id
            tableName: auth_credentials
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_auth_credentials_company_id
            tableName: auth_credentials
            columns:
              - column:
                  name: company_id

        - sql:
            sql: |
              ALTER TABLE auth_credentials
                ADD CONSTRAINT chk_access_type
                CHECK (access_type IN ('USER', 'COMPANY', 'ADMIN', 'CURATOR'));