spring:
  application:
    name: authservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: auth_db
    username: auth_service_user
    password: auth_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/auth_db
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: "36fc60f4796b476aa4893f175516d6b6"
            client-secret: "0f57670778e74b66b75daa62fbe75df0"
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8082/login/oauth2/code/yandex"
            scope:
              - login:email
              - login:info
              - login:avatar
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id

jwt:
  secret:
    access: "my_super_secret_access_key_that_must_be_long_enough_for_hs256"
internal:
  system-token: "my_super_secret_system_token_123"
app:
  security:
    public-endpoints: "/auth/register/**, /auth/login, /auth/refresh"
crypto:
  secret-key: "MySuperSecretKey1234567890123456"
server:
  port: 8082
