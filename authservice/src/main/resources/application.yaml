spring:
  application:
    name: authservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: auth_db
    username: auth_service_user
    password: auth_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/auth_db
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: auth-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: "${YANDEX_CLIENT_ID:not-configured}"
            client-secret: "${YANDEX_CLIENT_SECRET:not-configured}"
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8082/login/oauth2/code/yandex"
            scope:
              - login:email
              - login:info
              - login:avatar
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id

jwt:
  secret:
    access: "${JWT_ACCESS_SECRET:my_super_secret_access_key_that_must_be_long_enough_for_hs256}"
internal:
  system-token: "${INTERNAL_SYSTEM_TOKEN:my_super_secret_system_token_123}"
app:
  security:
    public-endpoints: "/auth/register/**, /auth/login, /auth/refresh"
crypto:
  secret-key: "${CRYPTO_SECRET_KEY:MySuperSecretKey1234567890123456}"
server:
  port: 8082
services:
  user:
    url: http://localhost:8089/user
  company:
    url: http://localhost:8083/company
kafka:
  topics:
    company-application-response: COMPANY_APPLICATION_RESPONSE_TOPIC
    company-auth: COMPANY_AUTH_TOPIC
  groups:
    auth: auth-service-group
  retry:
    attempts: "3"
