spring:
  application:
    name: notificationservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: notification_db
    username: notification_service_user
    password: notification_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5439/notification_db
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret:
    access: "${JWT_ACCESS_SECRET:my_super_secret_access_key_that_must_be_long_enough_for_hs256}"
internal:
  system-token: "${INTERNAL_SYSTEM_TOKEN:my_super_secret_system_token_123}"
crypto:
  secret-key: "${CRYPTO_SECRET_KEY:MySuperSecretKey1234567890123456}"
server:
  port: 8088
kafka:
  topics:
    company-auth: COMPANY_AUTH_TOPIC
    festival-application-response: FESTIVAL_APPLICATION_RESPONSE_TOPIC
    command-invite: COMMAND_INVITE_TOPIC
    resubmit-application: RESUBMIT_APPLICATION_TOPIC
  groups:
    notification: notification-group
  retry:
    attempts: "3"
