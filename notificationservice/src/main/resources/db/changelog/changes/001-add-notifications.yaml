databaseChangeLog:
  - changeSet:
      id: 001-add-notifications
      author: ilyap
      changes:
        - createTable:
            tableName: notification_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: company_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: festival_location_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: application_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: comment
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: event_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: command_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: command_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: related_user_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: target_user_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValue: "false"
                  constraints:
                    nullable: false
              - column:
                  name: notification_data_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_notifications_notification_data
            baseTableName: notifications
            baseColumnNames: notification_data_id
            referencedTableName: notification_data
            referencedColumnNames: id

        - createIndex:
            indexName: idx_notifications_target_user
            tableName: notifications
            columns:
              - column:
                  name: target_user_id

        - sql:
            sql: |
              ALTER TABLE notifications
                ADD CONSTRAINT chk_type
                CHECK (type IN ('INVITING_TEAM', 'APPROVING_COMPANY', 'REJECTING_COMPANY', 
              'APPROVING_FESTIVAL', 'REJECTING_FESTIVAL', 'RESUBMITTING_APPLICATION'));