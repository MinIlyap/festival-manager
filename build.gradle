plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.rsreu.festivalmanager'
version = '0.0.1-SNAPSHOT'

ext {
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.6"
            mavenBom "org.testcontainers:testcontainers-bom:2.0.4"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.named('compileJava') {
        options.compilerArgs << '-Amapstruct.unmappedTargetPolicy=ERROR'
    }

    test {
        useJUnitPlatform {
            excludeTags 'e2e'
        }
    }

    tasks.register('e2eTest', Test) {
        group = 'verification'
        description = 'Прогоняет e2e-тесты против поднятой системы (docker compose up -d).'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'e2e'
        }
    }
}
