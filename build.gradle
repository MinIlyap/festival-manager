plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.rsreu.festivalmanager'
version = '0.0.1-SNAPSHOT'

ext {
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

allprojects {
    repositories {
        mavenCentral()
    }
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.6"
            mavenBom "org.testcontainers:testcontainers-bom:2.0.4"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        // Processor order matters: lombok generates the accessors that mapstruct
        // reads, and the binding makes lombok's output visible to it.
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    tasks.withType(JavaCompile).configureEach {
        // Fail the build if a mapper leaves a target field unset: silently
        // dropping a field is the main risk when replacing hand-written mapping.
        options.compilerArgs << '-Amapstruct.unmappedTargetPolicy=ERROR'
    }

    test {
        useJUnitPlatform()
    }
}
