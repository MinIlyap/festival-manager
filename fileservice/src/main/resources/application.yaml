spring:
  application:
    name: fileservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: file_db
    username: file_service_user
    password: file_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5441/file_db
  jpa:
    hibernate:
      ddl-auto: none

minio:
  url: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}

app:
  security:
    public-endpoints: "/files/avatar/**, /files/FESTIVAL_LOCATION/**, /files/FESTIVAL_EVENT/**, /files/FESTIVAL_STAND/**, /files/EVENT_REWARD/**, /files/COMPANY_LOGO/**, /files/PRODUCT_INSTANCE/**"

jwt:
  secret:
    access: "${JWT_ACCESS_SECRET:my_super_secret_access_key_that_must_be_long_enough_for_hs256}"

internal:
  system-token: "${INTERNAL_SYSTEM_TOKEN:my_super_secret_system_token_123}"
crypto:
  secret-key: "${CRYPTO_SECRET_KEY:MySuperSecretKey1234567890123456}"
server:
  port: 8086
services:
  event:
    url: http://localhost:8084/internal/access/events/
  festival:
    url: http://localhost:8085/internal/access/festivals/
