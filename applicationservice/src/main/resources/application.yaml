spring:
  application:
    name: applicationservice
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  datasource:
    name: application_db
    username: application_service_user
    password: application_service_password
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5440/application_db
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: application-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
jwt:
  secret:
    access: "${JWT_ACCESS_SECRET:my_super_secret_access_key_that_must_be_long_enough_for_hs256}"
internal:
  system-token: "${INTERNAL_SYSTEM_TOKEN:my_super_secret_system_token_123}"
crypto:
  secret-key: "${CRYPTO_SECRET_KEY:MySuperSecretKey1234567890123456}"
server:
  port: 8081
kafka:
  topics:
    company-application-request: COMPANY_APPLICATION_REQUEST_TOPIC
    festival-application-request: FESTIVAL_APPLICATION_REQUEST_TOPIC
    company-application-response: COMPANY_APPLICATION_RESPONSE_TOPIC
    festival-application-response: FESTIVAL_APPLICATION_RESPONSE_TOPIC
    resubmit-application: RESUBMIT_APPLICATION_TOPIC
  groups:
    application: application-service-group
  retry:
    attempts: "3"
